name: Build Linux e publicar

# Compila o Tanja para Linux (AppImage + deb), roda os testes e anexa os arquivos à Release da versão.
# Este workflow mora aqui (e não no repositório do código) porque o GITHUB_TOKEN deste repositório já pode
# publicar nas Releases dele, então nenhuma credencial com poder de escrita precisa ser guardada em lugar nenhum.
# O código-fonte (repositório privado Glawther/tanja) é lido com uma chave de implantação SOMENTE LEITURA,
# guardada como o segredo TANJA_SOURCE_KEY.
#
# Disparo (o `npm run release` do projeto faz isso sozinho):
#   gh workflow run build-linux.yml --repo Glawther/tanja-releases -f version=0.3.1 -f ref=main
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: 0.3.1). Precisa bater com a versão do package.json do código.'
        required: true
      ref:
        description: 'Commit ou branch do código-fonte'
        required: true
        default: 'main'
      tag:
        description: 'Tag da Release que receberá os arquivos (vazio = v + versão)'
        required: false
        default: ''

permissions:
  contents: write   # só para anexar arquivos às Releases deste repositório

jobs:
  linux:
    runs-on: ubuntu-22.04   # glibc mais antiga = AppImage compatível com mais distribuições
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag != '' && inputs.tag || format('v{0}', inputs.version) }}
    steps:
      - name: Código-fonte (repositório privado, chave só de leitura)
        uses: actions/checkout@v4
        with:
          repository: Glawther/tanja
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TANJA_SOURCE_KEY }}
          path: tanja

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Conferir a versão do código
        working-directory: tanja
        run: |
          CODE_VERSION=$(node -p "require('./package.json').version")
          echo "versão no código: $CODE_VERSION | pedida: $VERSION"
          if [ "$CODE_VERSION" != "$VERSION" ]; then echo "A versão do package.json não bate com a pedida."; exit 1; fi

      - name: Conferir que a Release existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Dependências do sistema (LibreOffice para os testes; Xvfb e xdotool para simular o gesto)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-impress libreoffice-draw \
            xvfb xdotool libgtk-3-0 libnss3 libxss1 libxtst6 libatspi2.0-0 libuuid1 libsecret-1-0 libnotify4 libasound2

      - name: Instalar dependências do projeto
        working-directory: tanja
        run: npm install

      - name: Autoteste das conversões
        working-directory: tanja
        run: REQUIRE_LO=1 node scripts/selftest.js

      - name: Compilar (AppImage + deb)
        working-directory: tanja
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Teste de abertura e do gesto (Xvfb)
        working-directory: tanja
        run: bash scripts/smoke-linux.sh

      - name: Anexar à Release
        working-directory: tanja
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/*.AppImage dist/*.deb dist/latest-linux.yml
          gh release upload "$TAG" dist/*.AppImage dist/*.deb dist/latest-linux.yml --clobber --repo "$GITHUB_REPOSITORY"
